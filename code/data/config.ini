LOGLEVEL=1
FASTBOOT=0
; stop the motor if the motor current is lager than MAXCURRENT
MAXCURRENT=2.5
; stop the motor if the battery voltage drops below MINVOLTAGE
MINVOLTAGE=6.4
BLUETOOTH=1
BLENAME=KiteReel
; the pin must me a number (not too large)
BLEPIN=1234
; on start when pressing the rotarybutton it will try to connect to the configured wifi
; wifi is only needed for OTA updates
WIFISSID=<SSID>
WIFIPASSWORD=<PASSWORD>
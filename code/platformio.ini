; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
; rename "my_platformio.ini.example" to "my_platformio.ini" and make your changes there
; by doing this, the updates the project makes do not get lost and you can put
; your password and address safely in the "my_platformio.ini", this file will never 
; be put in git (a line in .gitignore)
; copy the "data" directory to "mydata" and change the config.ini to your needs and upload it to the ESP
extra_configs =
  myplatformio.ini
  mydata/config.ini

[env:dfrobot_beetle_esp32c3]
platform = espressif32
board = dfrobot_beetle_esp32c3
framework = arduino
extra_scripts = 
    pre:./bin/auto_firmware_version.py
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.14
    robtillaart/INA226@^0.6.4
    igorantolic/Ai Esp32 Rotary Encoder@^1.7
build_flags =
    ${common.additional_build_flags}